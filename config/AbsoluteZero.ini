; AbsoluteZero.ini — Mouse Alignment Assist for Starfield
; Place in Data\SFSE\Plugins\

; ---- Live Tuning Hotkeys (in-game) ----
;   Alt+Numpad+/-     Radius ±2.0
;   Ctrl+Numpad+/-    Idle delay ±10ms
;   Shift+Numpad+/-   Decay rate ±0.5
;   Ctrl+Alt+0        Toggle enable/disable
;   Alt+Numpad 0      Toggle Locked Reticule (Virtual Joy) mode
;   Ctrl+Alt+S        Save current settings to this file

[MouseAlign]
bEnabled = true
fRadius = 140.0         ; 70% of the circular range (0-200). Covers most aim positions.
iIdleMs = 80            ; Mouse idle time before decay starts (milliseconds)
fDecayRate = 12.0       ; Exponential decay speed (higher = faster snap to center)
iPollRateHz = 120       ; Polling frequency (Hz)
iSuppressKey = 0x42     ; Hold to suppress auto-centering (default: B). Virtual key code.
                        ; Common keys: B=0x42, V=0x56, G=0x47, Tab=0x09, CapsLock=0x14
                        ; Full list: https://learn.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
                        ; Set to 0 to disable the suppress key entirely.
bLogEnabled = false     ; Enable debug logging to AbsoluteZero.log

[VirtualJoy]
bVirtualJoy = false     ; Locked Reticule mode. Locks crosshair to center and drives steering directly.
iVJoyToggleKey = 0x60   ; Virtual key code for toggling Locked Reticule mode (default: Numpad 0)
bVJoyToggleAlt = true   ; Require Alt to be held when pressing the toggle key
